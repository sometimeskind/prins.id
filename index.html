<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUR NAME</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 2rem;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: #e8e8e8;
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
      transition: border-color 0.2s, color 0.2s;
    }

    nav a:hover {
      color: #fff;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>YOUR NAME</h1>
    <p>YOUR TITLE OR ONE-LINER</p>
    <nav>
      <a href="https://github.com/sometimeskind">GitHub</a>
      <a href="mailto:you@prins.id">you@prins.id</a>
    </nav>
  </main>
</body>
</html>
